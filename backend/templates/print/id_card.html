<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8" />
<style>
  @page { size: 85.6mm 54mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; direction: rtl; font-size: 7pt; line-height: 1.15; }
  .card {
    width: 85.6mm; height: 54mm; padding: 2.5mm 3.5mm;
    background: #fdfaf3;
    border: 0.5pt solid #b8942f;
    page-break-after: always;
  }
  .card:last-child { page-break-after: auto; }
  .top { height: 7mm; }
  .top img.seal { height: 6mm; }
  .top .org { font-size: 5.5pt; font-weight: 800; color: #5a4a1a; margin-inline-start: 2mm; }
  .name { font-size: 10pt; font-weight: 800; margin-top: 3mm; height: 5mm; }
  .rank { font-size: 6.5pt; color: #555; height: 4mm; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2mm; }
  .ids .label { font-size: 5.5pt; color: #777; }
  .ids .value { font-size: 7.5pt; font-weight: 700; }
</style>
</head>
<body>
{% for card in cards %}
<div class="card">
  <div class="top">
    <img class="seal" src="static/nasf-seal.jpg" alt="الشعار" /><span class="org">الجهاز الوطني للقوى المساندة - الوحدة القتالية الرابعة</span>
  </div>
  <div>
    <div class="name">{{ card.member.full_name }}</div>
    <div class="rank">{{ card.member.rank.name_ar }} — {{ card.member.faction.name_ar }}</div>
  </div>
  <div class="row">
    <div class="ids">
      <div class="label">الرقم الحربي</div>
      <div class="value"><bdi dir="ltr">{{ card.member.force_number }}</bdi></div>
    </div>
  </div>
</div>
{% endfor %}
</body>
</html>
