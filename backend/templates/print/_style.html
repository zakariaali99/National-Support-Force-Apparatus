<style>
  @page {
    size: A4;
    margin: 16mm 14mm;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    direction: rtl;
    color: #1a1a1a;
    font-size: 11pt;
    line-height: 1.6;
  }
  h1, h2, h3 { margin: 0 0 8pt 0; }
  h1 { font-size: 18pt; font-weight: 800; color: #0a2540; margin-bottom: 2pt; }
  h2 { font-size: 13pt; font-weight: 700; border-bottom: 1.5pt solid #b8942f; padding-bottom: 4pt; margin-top: 16pt; margin-bottom: 14pt; color: #0a2540; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: start; padding: 6pt 8pt; border-bottom: 0.5pt solid #ddd; font-size: 10pt; }
  th { font-weight: 700; background: #f2f2f2; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2.5pt solid #b8942f;
    padding-bottom: 10pt;
    margin-bottom: 14pt;
  }
  .header img { height: 46pt; width: auto; }
  .header .title { text-align: right; }

  .profile-top-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16pt;
    background: #f8fafc;
    border: 1pt solid #cbd5e1;
    border-radius: 8pt;
    padding: 14pt 16pt;
    margin-bottom: 16pt;
  }
  .photo-frame {
    width: 92pt;
    height: 112pt;
    border: 1.5pt solid #b8942f;
    border-radius: 6pt;
    background: #ffffff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-shrink: 0;
    margin: 0;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-frame .no-photo-text {
    font-size: 8.5pt;
    color: #64748b;
    font-weight: 700;
    line-height: 1.3;
  }

  .profile-summary {
    flex: 1;
  }
  .profile-summary .main-name {
    font-size: 15pt;
    font-weight: 800;
    color: #0a2540;
    margin-bottom: 8pt;
  }

  .field-grid { display: flex; flex-wrap: wrap; margin-bottom: 8pt; }
  .field { width: 48%; min-width: 48%; flex: 0 0 48%; margin-bottom: 14pt; box-sizing: border-box; }
  .field .label { font-size: 9pt; color: #64748b; font-weight: 700; margin-bottom: 3.5pt; }
  .field .value { font-size: 10.5pt; font-weight: 700; color: #0f172a; line-height: 1.4; }
  .muted { color: #64748b; font-size: 9pt; }
  .footer { position: fixed; bottom: -10mm; left: 0; right: 0; text-align: center; font-size: 8pt; color: #94a3b8; }
</style>
